<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Kleur van de statusbalk/browser-chrome moet gelijk zijn aan de
       topbalk van de app zelf (wit/donker), anders ontstaat er een
       zichtbare naad bovenaan i.p.v. een vloeiende overgang. -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Kapitas is een beleggingsdashboard voor Belgische beleggers. Bundel je aandelen, ETF's en crypto in één overzicht, met automatische Belgische belastingberekeningen en live koersen." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kapitas" />
  <meta name="application-name" content="Kapitas" />

  <!-- Open Graph / social preview — ook bruikbaar door tools die geen JavaScript uitvoeren -->
  <meta property="og:site_name" content="Kapitas" />
  <meta property="og:title" content="Kapitas - Portfolio tracker voor Belgische beleggers" />
  <meta property="og:description" content="Bundel je aandelen, ETF's en crypto in één overzicht, met automatische Belgische belastingberekeningen en live koersen." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kapitas.be" />

  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/favicon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="%PUBLIC_URL%/favicon-512.png" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
  <title>Kapitas - Portfolio tracker voor Belgische beleggers</title>
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
</head>
<body>
  <noscript>
    <div style="font-family: sans-serif; padding: 40px; max-width: 600px; margin: 0 auto;">
      <h1>Kapitas</h1>
      <p>Kapitas is een beleggingsdashboard voor Belgische beleggers. Bundel je aandelen, ETF's en crypto in één overzicht, met automatische Belgische belastingberekeningen en live koersen.</p>
      <p>Je hebt JavaScript nodig om Kapitas te gebruiken.</p>
    </div>
  </noscript>
  <div id="root"></div>
</body>
</html>
