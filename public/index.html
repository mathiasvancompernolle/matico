<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Kleur van de statusbalk/browser-chrome moet gelijk zijn aan de
       topbalk van de app zelf (wit/donker), anders ontstaat er een
       zichtbare naad bovenaan i.p.v. een vloeiende overgang. -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Kapitas is een beleggingsdashboard voor Belgische beleggers. Bundel je aandelen, ETF's en crypto in één overzicht, met automatische Belgische belastingberekeningen en live koersen." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Kapitas" />
  <meta name="application-name" content="Kapitas" />

  <!-- Open Graph / social preview — ook bruikbaar door tools die geen JavaScript uitvoeren -->
  <meta property="og:site_name" content="Kapitas" />
  <meta property="og:title" content="Kapitas - Portfolio tracker voor Belgische beleggers" />
  <meta property="og:description" content="Bundel je aandelen, ETF's en crypto in één overzicht, met automatische Belgische belastingberekeningen en live koersen." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.kapitas.be/" />
  <meta property="og:locale" content="nl_BE" />
  <meta property="og:image" content="https://www.kapitas.be/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Kapitas – portfolio tracker voor Belgische beleggers" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Kapitas - Portfolio tracker voor Belgische beleggers" />
  <meta name="twitter:description" content="Bundel je aandelen, ETF's en crypto in één overzicht, met automatische Belgische belastingberekeningen en live koersen." />
  <meta name="twitter:image" content="https://www.kapitas.be/og-image.png" />
  <link rel="canonical" href="https://www.kapitas.be/" />

  <!-- Ingelogde gebruikers: de vooraf gegenereerde website-HTML (voor
       zoekmachines en bezoekers) niet even laten flitsen vóór de app laadt -->
  <script>try{if(Object.keys(localStorage).some(function(k){return /^sb-.*-auth-token$/.test(k)}))document.documentElement.className+=' kp-sessie'}catch(e){}</script>
  <style>.kp-sessie [data-prerender]{display:none}</style>

  <!-- Vercel Web Analytics: anonieme bezoekersstatistieken, zonder cookies -->
  <script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
  <script defer src="/_vercel/insights/script.js"></script>

  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/favicon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="%PUBLIC_URL%/favicon-512.png" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
  <title>Kapitas - Portfolio tracker voor Belgische beleggers</title>
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
</head>
<body>
  <noscript>
    <div style="font-family: sans-serif; padding: 40px; max-width: 600px; margin: 0 auto;">
      <h1>Kapitas</h1>
      <p>Kapitas is een beleggingsdashboard voor Belgische beleggers. Bundel je aandelen, ETF's en crypto in één overzicht, met automatische Belgische belastingberekeningen en live koersen.</p>
      <p>Je hebt JavaScript nodig om Kapitas te gebruiken.</p>
    </div>
  </noscript>
  <div id="root"></div>
</body>
</html>
